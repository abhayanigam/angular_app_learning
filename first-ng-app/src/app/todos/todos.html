<h3>Todos List</h3>

<!--   Bad way to show the loading state -->
<!-- <p *ngIf="!todoItems().length">Loading...</p> -->

@if (!todoItems().length) {
  <p>Loading...</p>
}

<form>
  <label>Filter Todos</label>
  <input placeholder="Search todos..." [(ngModel)]="searchTerm" name="searchTerm" />
</form>

<ul class="todos">
  @for (todo of todoItems() | filterTodos: searchTerm(); track todo.id) {
    <app-todo-item (todoToggle)="updateTodoItem($event)" [todo]="todo"></app-todo-item>
  }
</ul>
